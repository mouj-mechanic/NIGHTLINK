<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05020f"/>
      <stop offset="55%" stop-color="#12082a"/>
      <stop offset="100%" stop-color="#1a0a18"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="320" rx="420" ry="180" fill="url(#glow)"/>
  <!-- city silhouettes -->
  <g fill="#0a0614" opacity="0.95">
    <rect x="40" y="380" width="90" height="320"/>
    <rect x="150" y="300" width="70" height="400"/>
    <rect x="240" y="360" width="110" height="340"/>
    <rect x="1280" y="340" width="80" height="360"/>
    <rect x="1380" y="280" width="100" height="420"/>
    <rect x="1490" y="360" width="70" height="340"/>
  </g>
  <!-- club facade -->
  <rect x="420" y="260" width="760" height="480" rx="8" fill="#0d0a16" stroke="#2a1848" stroke-width="2"/>
  <rect x="460" y="300" width="680" height="80" rx="4" fill="#12081f"/>
  <text x="800" y="358" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="54" fill="url(#neon)" letter-spacing="14">NIGHTLINK</text>
  <!-- entrance -->
  <rect x="700" y="420" width="200" height="320" fill="#050308"/>
  <rect x="710" y="430" width="85" height="300" fill="#1a1028"/>
  <rect x="805" y="430" width="85" height="300" fill="#1a1028"/>
  <!-- red carpet -->
  <polygon points="700,740 900,740 980,900 620,900" fill="#4c0519" opacity="0.85"/>
  <!-- neon windows -->
  <g opacity="0.7">
    <rect x="500" y="450" width="60" height="90" fill="#7c3aed" opacity="0.35"/>
    <rect x="1040" y="450" width="60" height="90" fill="#3b82f6" opacity="0.35"/>
    <rect x="500" y="570" width="60" height="90" fill="#ec4899" opacity="0.25"/>
    <rect x="1040" y="570" width="60" height="90" fill="#a78bfa" opacity="0.3"/>
  </g>
  <!-- cars silhouettes -->
  <ellipse cx="280" cy="780" rx="110" ry="28" fill="#000" opacity="0.55"/>
  <rect x="190" y="730" width="180" height="45" rx="18" fill="#141018"/>
  <ellipse cx="1320" cy="790" rx="120" ry="30" fill="#000" opacity="0.55"/>
  <rect x="1220" y="735" width="200" height="48" rx="20" fill="#101018"/>
</svg>
